<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; padding: 20px; font-family: var(--font-primary); }
.row { display: flex; gap: 2px; margin-bottom: 2px; }
.swatch { flex: 1; height: 72px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
.swatch span { font-size: 11px; font-weight: 700; }
.swatch small { font-size: 10px; }
.group-label { font-size: 11px; color: #474543; margin: 10px 0 4px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
</style></head><body>
<div class="group-label">Danger</div>
<div class="row">
  <div class="swatch" style="background:#CE3E39;color:#fff"><span>Danger</span><small>#CE3E39</small></div>
  <div class="swatch" style="background:#A2312D;color:#fff"><span>Danger hover</span><small>#A2312D</small></div>
  <div class="swatch" style="background:#F4E1E2;color:#CE3E39;border:1px solid #CE3E39"><span>Danger bg</span><small>#F4E1E2</small></div>
</div>
<div class="group-label">Success</div>
<div class="row">
  <div class="swatch" style="background:#42814A;color:#fff"><span>Success</span><small>#42814A</small></div>
  <div class="swatch" style="background:#F6FFF8;color:#42814A;border:1px solid #42814A"><span>Success bg</span><small>#F6FFF8</small></div>
</div>
<div class="group-label">Warning</div>
<div class="row">
  <div class="swatch" style="background:#F8BB47;color:#2D2D2D"><span>Warning</span><small>#F8BB47</small></div>
  <div class="swatch" style="background:#FEF1D8;color:#2D2D2D;border:1px solid #F8BB47"><span>Warning bg</span><small>#FEF1D8</small></div>
</div>
</body></html>
