<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; padding: 20px; font-family: var(--font-primary); }
.row { display: flex; gap: 2px; margin-bottom: 2px; }
.swatch { flex: 1; height: 80px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
.swatch span { font-size: 11px; font-weight: 700; }
.swatch small { font-size: 10px; font-weight: 400; opacity: 0.85; }
.group-label { font-size: 11px; color: #474543; margin: 10px 0 4px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
</style></head><body>
<div class="group-label">Brand / Primary</div>
<div class="row">
  <div class="swatch" style="background:#013366;color:#fff"><span>Primary</span><small>#013366</small></div>
  <div class="swatch" style="background:#053662;color:#fff"><span>Primary dark</span><small>#053662</small></div>
  <div class="swatch" style="background:#1E5189;color:#fff"><span>Hover</span><small>#1E5189</small></div>
  <div class="swatch" style="background:#01264C;color:#fff"><span>Pressed</span><small>#01264C</small></div>
</div>
<div class="group-label">Interactive</div>
<div class="row">
  <div class="swatch" style="background:#2E5DD7;color:#fff"><span>Focus / Info</span><small>#2E5DD7</small></div>
  <div class="swatch" style="background:#255A90;color:#fff"><span>Link</span><small>#255A90</small></div>
  <div class="swatch" style="background:#D8EAFD;color:#013366"><span>Info bg</span><small>#D8EAFD</small></div>
</div>
</body></html>
